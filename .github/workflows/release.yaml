name: Release
on:
  push:
    branches: ["main"]
  workflow_dispatch: ~

env:
  DEVBOX_VERSION: '0.17.2'

# Default permissions
permissions:
  contents: read

# Allow only one concurrent release, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these releases to complete.
concurrency:
  group: "release"
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  codegen:
    name: Run codegen and release
    runs-on: ubuntu-latest

    permissions:
      contents: write # the codegen pipeline commits + creates a tag + pushes back to origin
      pull-requests: write # to open PRs

    outputs:
      is_release: ${{ steps.release.outputs.is_release }}

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install devbox
        uses: jetify-com/devbox-install-action@8c6a66ed6273138b1915457069de78cb52fe3bd7 # v0.15.0
        with:
          enable-cache: 'true'
          devbox-version: ${{ env.DEVBOX_VERSION }}

      - name: Prepare a release
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git config --global url."https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/".insteadOf "git@github.com:"

          make prepare-release
        env:
          TERM: 'xterm'
          LOG_LEVEL: '7' # debug
          DRY_RUN: 'no'
          SKIP_VALIDATION: 'no'
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }} # to be used by `gh`

      - name: Release
        id: release
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git config --global url."https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/".insteadOf "git@github.com:"

          make release
        env:
          TERM: 'xterm'
          LOG_LEVEL: '7' # debug
          DRY_RUN: 'no'

  build_docs:
    needs: codegen
    name: Build documentation
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write      # to deploy to Pages
      id-token: write   # to verify the deployment originates from an appropriate source

    # Deploy to the github-pages environment
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: main # to ensure that we build docs using the results of the codegen job
          persist-credentials: false

      - name: Install devbox
        uses: jetify-com/devbox-install-action@8c6a66ed6273138b1915457069de78cb52fe3bd7 # v0.15.0
        with:
          enable-cache: 'true'
          devbox-version: ${{ env.DEVBOX_VERSION }}

      - name: Build documentation website
        run: |
          make docs

      - name: Upload static files as artifact
        id: deployment
        if: ${{ needs.codegen.outputs.is_release == 'yes' }}
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ./build/docs/site

  publish_documentation:
    needs: build_docs
    name: Publish documentation
    runs-on: ubuntu-latest
    permissions:
      pages: write      # to deploy to Pages
      id-token: write   # to verify the deployment originates from an appropriate source

    if: ${{ needs.codegen.outputs.is_release == 'yes' }}

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 #v5.0.0

  release_python:
    needs: codegen
    name: Release Python package
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write  # mandatory for trusted publishing

    environment:
      name: pypi
      url: https://pypi.org/p/promql_builder

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: main # to ensure that we use the latest and greatest
          persist-credentials: false

      - name: Install devbox
        uses: jetify-com/devbox-install-action@8c6a66ed6273138b1915457069de78cb52fe3bd7 # v0.15.0
        with:
          enable-cache: 'true'
          devbox-version: ${{ env.DEVBOX_VERSION }}

      - name: Build a binary wheel and a source tarball
        run: devbox run ./scripts/build-python-wheel.sh

      - name: Publish distribution 📦 to PyPI
        if: ${{ needs.codegen.outputs.is_release == 'yes' }}
        uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b # v1.14.0
        with:
          packages-dir: python/dist/
          attestations: false

  release_typescript:
    needs: codegen
    name: Release Typescript package
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write  # mandatory for trusted publishing

    env:
      NODE_VERSION: '22'

    environment:
      name: typescript
      url: https://www.npmjs.com/package/@grafana/promql-builder

    defaults:
      run:
        working-directory: ./typescript

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: main # to ensure that we use the latest and greatest
          persist-credentials: false

      - name: Use Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          scope: '@grafana'
          registry-url: 'https://registry.npmjs.org'

      - name: Update NPM
        run: npm install -g npm@latest

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build

      - name: Publish to NPM registry
        if: ${{ needs.codegen.outputs.is_release == 'yes' }}
        run: npm publish
